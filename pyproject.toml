[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rigetti-fake-backend"
version = "0.1.0"
description = "FakeCephus-108Q: Open-source fake backend for Rigetti's 108-qubit Cephus-1-108Q processor"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]
keywords = [
    "quantum computing",
    "noise model",
    "Rigetti",
    "Cephus-1-108Q",
    "fake backend",
    "quantum simulator",
    "NISQ",
    "108-qubit",
    "heterogeneous topology",
]
dependencies = [
    "numpy>=1.21",
    "networkx>=2.6",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.13"]
pyquil = ["pyquil>=4.0"]
all = ["qiskit>=1.0", "qiskit-aer>=0.13", "pyquil>=4.0"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
include = ["fakecephus_108q*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
